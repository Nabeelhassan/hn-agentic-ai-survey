<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>What HN runs — agentic AI setup, Nov 2026</title>
    <meta
      name="description"
      content="A tracked snapshot of the Ask HN thread on AI subscriptions, harnesses, orchestration, and agent platforms."
    />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("hn-survey-theme");
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%2318181b'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23fafafa' font-family='monospace'>HN</text></svg>"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
