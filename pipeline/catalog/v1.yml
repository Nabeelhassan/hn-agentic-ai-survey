version: 1
retrieved_at: "2026-11-15"
notes: >
  List prices as each vendor displayed them on the retrieval date, for the plans a
  respondent could plausibly mean. No currency conversion: EUR and GBP prices stay in
  their own currency. Free and team plans are included so a tier string can be resolved,
  but only individual paid plans belong in spend comparisons. A null price means the
  vendor page did not expose it; it is a gap, not a zero.
providers:
  - id: anthropic
    label: Anthropic (Claude plans)
    source_url: https://claude.com/pricing
    verification: verified
    currency: USD
    plans:
      - id: free
        label: Free
        audience: individual
        price_monthly: 0
        aliases: [free]
      - id: pro
        label: Pro
        audience: individual
        price_monthly: 20
        price_annual: 200
        annual_monthly: 17
        aliases: [pro, claude pro, $20, $20/mo, $20/month, 20$, $20usd]
      - id: max
        label: Max
        audience: individual
        price_monthly: 100
        aliases: [max, max 5x, max plan, 5x, $100, $100/mo, $100/m, $100 plan, max $100]
      - id: ultra
        label: Ultra
        audience: individual
        price_monthly: 200
        aliases: [ultra, ultra plan, max 20x, 20x, max 200, $200, $200/mo, $200/ea]
        note: "The thread mostly says Ultra where the vendor now says Ultra (formerly Max 20x)."
      - id: team-standard
        label: Team (standard seat)
        audience: team
        price_monthly: 25
        price_annual: 240
        annual_monthly: 20
        aliases: [team, team plan, team standard]
      - id: enterprise
        label: Enterprise
        audience: enterprise
        price_monthly: null
        note: "Seat price plus API usage; not comparable to individual plans."

