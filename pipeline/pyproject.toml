[project]
name = "hn-agents"
version = "0.1.0"
description = "Snapshot pipeline for the Ask HN agentic AI setup thread"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hn_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
